<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="iFeed">
  <defs>
    <!-- Pin greens -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FBF4A"/>
      <stop offset="45%" stop-color="#1BA83A"/>
      <stop offset="100%" stop-color="#0E8A28"/>
    </linearGradient>
    <linearGradient id="pinShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3DD45A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#087A22" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CDE45"/>
      <stop offset="100%" stop-color="#2EAE34"/>
    </linearGradient>
    <!-- Text blues -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D6FE0"/>
      <stop offset="40%" stop-color="#1E4FC8"/>
      <stop offset="100%" stop-color="#0A2F9A"/>
    </linearGradient>
    <linearGradient id="textShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A3A18" flood-opacity="0.18"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06183F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ===== ICON: location pin + leaf ===== -->
  <g transform="translate(28,18)" filter="url(#softShadow)">
    <!-- Pin body (classic teardrop map marker) -->
    <path fill="url(#pinGrad)" d="
      M110 8
      C155 8 192 45 192 92
      C192 128 172 155 140 188
      C128 201 118 212 110 222
      C102 212 92 201 80 188
      C48 155 28 128 28 92
      C28 45 65 8 110 8
      Z"/>
    <!-- Soft inner shade -->
    <path fill="url(#pinShade)" d="
      M110 22
      C147 22 176 52 176 92
      C176 122 159 147 132 176
      C124 185 116 194 110 202
      C104 194 96 185 88 176
      C61 147 44 122 44 92
      C44 52 73 22 110 22
      Z" opacity="0.55"/>
    <!-- Inner circle (hole) -->
    <circle cx="110" cy="92" r="38" fill="#FFFFFF"/>
    <circle cx="110" cy="92" r="38" fill="none" stroke="#0E8A28" stroke-width="3" opacity="0.15"/>

    <!-- Leaf inside circle -->
    <g transform="translate(110,96)">
      <!-- leaf blade -->
      <path fill="url(#leafGrad)" d="
        M0 28
        C-6 10 -22 -6 -36 -18
        C-20 -28 -4 -30 8 -22
        C22 -12 18 10 0 28
        Z"/>
      <!-- leaf vein -->
      <path d="M-2 22 C-8 8 -16 -4 -28 -14" fill="none" stroke="#1B7A28" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      <!-- stem -->
      <path d="M0 28 C2 34 4 40 4 46" fill="none" stroke="#1B7A28" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Yellow sparkles -->
    <circle cx="168" cy="36" r="7" fill="#F5C518"/>
    <circle cx="178" cy="58" r="4.5" fill="#F5C518"/>
    <circle cx="42" cy="48" r="5" fill="#F5C518"/>
    <circle cx="52" cy="28" r="3.5" fill="#FFD84A"/>
  </g>

  <!-- ===== WORDMARK: iFeed ===== -->
  <g transform="translate(250,48)" filter="url(#textShadow)">
    <!-- Using a bold rounded sans approximation via path-like text -->
    <text
      x="0" y="120"
      font-family="Segoe UI, system-ui, -apple-system, Arial Rounded MT Bold, Arial, sans-serif"
      font-size="132"
      font-weight="800"
      letter-spacing="-2"
      fill="url(#textGrad)"
    >iFeed</text>
    <!-- subtle top highlight overlay -->
    <text
      x="0" y="120"
      font-family="Segoe UI, system-ui, -apple-system, Arial Rounded MT Bold, Arial, sans-serif"
      font-size="132"
      font-weight="800"
      letter-spacing="-2"
      fill="url(#textShine)"
    >iFeed</text>
  </g>
</svg>
